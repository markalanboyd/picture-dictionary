<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; padding: 12px; }
    label { display: block; margin: 12px 0 4px; }
    input, select { font-size: 14px; }
    #saved { color: green; margin-left: 8px; }
  </style>
</head>
<body>
  <label for="count">Number of pictures (1–12)</label>
  <input id="count" type="number" min="1" max="12">

  <label for="maxWords">Max words in a selection that triggers a lookup</label>
  <input id="maxWords" type="number" min="1" max="5">

  <label for="source">Image source</label>
  <select id="source">
    <option value="ddg">DuckDuckGo (falls back to Openverse)</option>
    <option value="openverse">Openverse only (stable, free-licensed images)</option>
  </select>

  <p><button id="save">Save</button><span id="saved"></span></p>
  <script src="options.js"></script>
</body>
</html>
